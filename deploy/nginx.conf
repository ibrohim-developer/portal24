# Static-export phase: nginx serves out/ directly, no Node process.
#
# When the REST API lands and we switch to ISR, `output: "export"` comes out of
# next.config.ts and this whole server block is replaced by a proxy_pass to the
# Node process running under pm2 on 127.0.0.1:3000.

server {
    listen 80;
    server_name portal24.uz www.portal24.uz;

    root /var/www/portal24/out;
    index index.html;

    # Build assets are content-hashed, so they can be cached indefinitely.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # trailingSlash: true means every route is a directory holding index.html.
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
