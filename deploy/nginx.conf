# ISR phase: Next.js runs under pm2 on 127.0.0.1:3000 and nginx proxies to it.
#
# This replaces the static-export block that served out/ directly. Pages are
# still prerendered, but they are refreshed on their own `revalidate` timers by
# the running process, so `next build` on its own no longer produces the site -
# the server has to stay up. See deploy/ecosystem.config.js.

upstream portal24_app {
    server 127.0.0.1:3000;
    # Reuse connections rather than opening one per request. Requires the
    # HTTP/1.1 + empty-Connection pair on every proxy_pass below.
    keepalive 32;
}

server {
    listen 80;
    server_name portal24.uz www.portal24.uz;

    # Build assets are content-hashed. Next sets
    # `public, max-age=31536000, immutable` on them itself and that header
    # cannot be overridden, so nginx only has to pass it through.
    location /_next/static/ {
        proxy_pass http://portal24_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://portal24_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Off because the app streams its HTML: with buffering on, nginx holds
        # the whole response back and the reader waits for the slowest part of
        # the page instead of seeing the top of it immediately.
        proxy_buffering off;

        # A regeneration fetches the CMS, which is occasionally slower than the
        # 60s nginx default.
        proxy_read_timeout 90s;
    }

    error_page 404 /404;

    # Next compresses its own HTML, but not everything it serves; leaving this
    # on costs nothing for already-compressed responses.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
}
